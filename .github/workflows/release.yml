name: Release

on:
  push:
    tags:
      - "*"

env:
  OAT_VERSION: "0.21.2"

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          allowUpdates: true
          omitBodyDuringUpdate: true

  # Build iw4x.dll from the vendored Scrubze/iw4x-src submodule at client/.
  # Same approach as iw4x-src's own release.yml: premake5 vs2022 to generate
  # solution files, msbuild Release/Win32. Output gets uploaded as a
  # workflow artifact so the Linux build-artifacts job can pull it in.
  build-dll:
    runs-on: windows-2022
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        working-directory: client
        run: tools/premake5 vs2022

      - name: Build iw4x.dll
        working-directory: client
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=Win32 build/iw4x.sln

      - name: Upload dll
        uses: actions/upload-artifact@v4
        with:
          name: slb-iw4x-dll
          path: client/build/bin/Win32/Release/iw4x.dll

  build-artifacts:
    runs-on: ubuntu-latest
    needs:
      - build-dll
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download iw4x.dll
        uses: actions/download-artifact@v4
        with:
          name: slb-iw4x-dll
          # Drops iw4x.dll at the repo root, which is where release.sh
          # expects to find it alongside iw4x.exe.
          path: .

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get -y install libstdc++-13-dev:i386

      - name: Setup OAT
        uses: diamante0018/setup-oat@main
        with:
          version: ${{ env.OAT_VERSION  }}

      - name: Link assets
        run: |
          for dir in zone_raw/*/; do
            folder=$(basename "$dir")
            Linker -v "$folder"
          done

      - name: Create release artifacts
        run: ./scripts/release.sh

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: rawfiles-release
          path: temp

  release:
    needs:
      - create-release
      - build-artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rawfiles-release
          path: temp
      - name: Prepare release tool
        run: |
          wget -O release-tool.tar.gz https://github.com/iw4x/launcher/releases/latest/download/release-tool-x86_64-unknown-linux-gnu.tar.gz
          tar -xvf release-tool.tar.gz
          chmod +x release-tool
      - name: Create release information
        run: ./release-tool --rename-files ./temp/launcher-files
      - uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: "temp/launcher-files/**/*.*,temp/artifact-files/**/*.*"
          artifactErrorsFailBuild: true
          allowUpdates: true
          # Flip the release to published once artifacts are uploaded. The
          # first ncipollo step (create-release job) still creates as draft
          # so users never see an empty release mid-build.
          draft: false
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: false
