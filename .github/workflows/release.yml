name: Release

# Every push to main cuts a release. Tag is v0.1.<run_number> -- run_number
# is a monotonically-increasing per-workflow counter so tags stay ordered
# even with rapid commits. Bump the "0.1" major.minor by editing this file
# (or grep for RELEASE_VERSION below) when ready to ship a real version
# bump alongside the iw4x.dll branding string.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# If a new commit lands before the current run finishes, cancel the
# in-flight one so we don't waste a windows-2022 minute on a release we'll
# immediately supersede.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  OAT_VERSION: "0.21.2"
  RELEASE_VERSION: "v0.1.${{ github.run_number }}"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          commit: ${{ github.sha }}
          draft: true
          allowUpdates: true
          omitBodyDuringUpdate: true

  # Build iw4x.dll from the inlined source tree at client/. premake5 vs2022
  # to generate solution files, msbuild Release/Win32. Output gets uploaded
  # as a workflow artifact so the Linux build-artifacts job can pull it in.
  build-dll:
    runs-on: windows-2022
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Generate project files
        working-directory: client
        run: tools/premake5 vs2022

      - name: Build iw4x.dll
        working-directory: client
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=Win32 build/iw4x.sln

      - name: Upload dll
        uses: actions/upload-artifact@v4
        with:
          name: slb-iw4x-dll
          path: client/build/bin/Win32/Release/iw4x.dll

  build-artifacts:
    runs-on: ubuntu-latest
    needs:
      - build-dll
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download iw4x.dll
        uses: actions/download-artifact@v4
        with:
          name: slb-iw4x-dll
          # Drops iw4x.dll at the repo root, which is where release.sh
          # expects to find it alongside iw4x.exe.
          path: .

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get -y install libstdc++-13-dev:i386

      - name: Setup OAT
        uses: diamante0018/setup-oat@main
        with:
          version: ${{ env.OAT_VERSION  }}

      - name: Link assets
        run: |
          for dir in zone_raw/*/; do
            folder=$(basename "$dir")
            Linker -v "$folder"
          done

      - name: Create release artifacts
        run: ./scripts/release.sh

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: rawfiles-release
          path: temp

  release:
    needs:
      - create-release
      - build-artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: rawfiles-release
          path: temp
      - name: Prepare release tool
        run: |
          wget -O release-tool.tar.gz https://github.com/iw4x/launcher/releases/latest/download/release-tool-x86_64-unknown-linux-gnu.tar.gz
          tar -xvf release-tool.tar.gz
          chmod +x release-tool
      - name: Create release information
        run: ./release-tool --rename-files ./temp/launcher-files
      - uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          commit: ${{ github.sha }}
          artifacts: "temp/launcher-files/**/*.*,temp/artifact-files/**/*.*"
          artifactErrorsFailBuild: true
          allowUpdates: true
          # Flip the release to published once artifacts are uploaded. The
          # first ncipollo step (create-release job) still creates as draft
          # so users never see an empty release mid-build.
          draft: false
          omitBodyDuringUpdate: true
          omitDraftDuringUpdate: false
