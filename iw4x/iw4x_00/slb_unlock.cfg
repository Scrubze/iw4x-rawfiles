// SLB: ran on every main menu open (wired in via main_text.menu's
// ON_MENU_OPEN). All commands here are idempotent -- re-running is a
// no-op for an already-set value. Two responsibilities:
//
//   1. Max rank + all challenge unlocks via the iw4x `unlockstats`
//      command (defined in QuickPatch.cpp).
//   2. Force every custom-class slot to an Intervention loadout. Because
//      this re-runs on every menu return, any user edits to classes get
//      wiped as soon as they come back to the main menu -- effectively
//      locking classes without needing a CAC menu disable.
//
// `setPlayerData` is gated behind developer mode in vanilla MW2 / iw4x,
// so flip the flag on for the duration of this file.

set developer 1

// --- max level + all unlocks ---------------------------------------------
unlockstats

// --- force Intervention on all 10 custom-class slots ---------------------
//
// Schema (from StructuredData.cpp):
//   customClasses[N].weaponSetups[0|1].weapon | .attachment[0|1] | .camo
//   customClasses[N].perks[0-4]            // 0=equipment, 1-3=perks, 4=deathstreak
//   customClasses[N].specialGrenade        // tactical
//   customClasses[N].name
//
// Weapon asset name is `cheytac` (bare, no _mp suffix at this layer).

setPlayerData customClasses 0 name "SLB SNIPER"
setPlayerData customClasses 0 weaponSetups 0 weapon cheytac
setPlayerData customClasses 0 weaponSetups 0 attachment 0 acog
setPlayerData customClasses 0 weaponSetups 0 attachment 1 fmj
setPlayerData customClasses 0 weaponSetups 1 weapon usp_45
setPlayerData customClasses 0 perks 0 claymore_mp
setPlayerData customClasses 0 perks 1 specialty_bling
setPlayerData customClasses 0 perks 2 specialty_coldblooded
setPlayerData customClasses 0 perks 3 specialty_quieter
setPlayerData customClasses 0 perks 4 specialty_finalstand
setPlayerData customClasses 0 specialGrenade flash_grenade_mp

setPlayerData customClasses 1 name "SLB SNIPER"
setPlayerData customClasses 1 weaponSetups 0 weapon cheytac
setPlayerData customClasses 1 weaponSetups 0 attachment 0 acog
